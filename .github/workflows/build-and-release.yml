name: Build Database and Release

on:
  schedule:
    - cron: '0 5 * * 5'  # Every Friday at 05:00 UTC
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write  # Required for creating releases and committing data

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak

      - name: Add flathub remote (user-level)
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Update appstream (user-level)
        run: |
          flatpak update --appstream --user

      - name: Convert flatpak XML to JSON (user-level paths)
        run: |
          python3 src/flatpak_xml_to_json.py --xml "$HOME/.local/share/flatpak/appstream/flathub/x86_64/active/appstream.xml.gz" --icons "$HOME/.local/share/flatpak/appstream/flathub/x86_64/active/icons/128x128" --out "data/all"

      - name: Sync flatpak apps
        run: |
          python3 src/flatpak_sync.py --mine data/apps --flatpak "data/all"

      - name: Get latest AppImages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 src/get_latest_appimages.py --last-ok-report data/last_ok_report.json --ci-summary ci_summary.md

      - name: Upload CI summary
        if: always()
        run: |
          if [ -f ci_summary.md ]; then
            cat ci_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate (lint, tests, build check)
        run: |
          ./check

      - name: Build database
        run: |
          python3 src/build-database.py

      - name: Pack icons
        run: |
          python3 src/pack-icons.py

      - name: Commit data changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/apps/ data/icons/ data/last_ok_report.json; then
            git add data/apps/ data/icons/ data/last_ok_report.json
            git commit -m "chore: weekly data refresh"
            git push
          else
            echo "No data changes to commit"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: latest
          tag_name: latest
          files: |
            data/output/app-icons.tar.gz
            data/output/apps.db.tar.gz
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}