name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          pip install ruff

      - name: Run lint checks
        run: |
          ruff check src/

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Validate database build
        run: |
          python3 src/build-database.py --check